<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relay Map Maker</title>
    <style>
      :root {
        background: #eaf6ff;
        color: #172033;
        font-family:
          Pretendard, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
      }

      body {
        margin: 0;
      }

      .boot-screen {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          linear-gradient(180deg, rgba(74, 157, 224, 0.54), rgba(246, 190, 0, 0.16) 62%, #f6fbff),
          #eaf6ff;
        background-size:
          32px 32px,
          32px 32px,
          auto,
          auto;
      }

      .boot-panel {
        width: min(420px, 100%);
        display: grid;
        gap: 12px;
        padding: 24px;
        border: 1px solid rgba(23, 32, 51, 0.13);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(232, 246, 255, 0.9)),
          rgba(255, 255, 255, 0.96);
        box-shadow: 0 16px 35px rgba(47, 127, 196, 0.14);
      }

      .boot-brand {
        width: fit-content;
        padding: 8px 12px;
        border-radius: 6px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.09) 1px, transparent 1px),
          linear-gradient(180deg, #ffe071, #f6be00);
        background-size:
          24px 24px,
          24px 24px,
          auto;
        font-weight: 900;
      }

      .boot-panel p {
        margin: 0;
        color: #64748b;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen">
        <section class="boot-panel">
          <div class="boot-brand">Relay Map Maker</div>
          <p>앱을 불러오는 중</p>
          <noscript>JavaScript를 켜야 플레이할 수 있습니다.</noscript>
        </section>
      </main>
    </div>
    <script>
      window.setTimeout(function () {
        var bootText = document.querySelector('.boot-panel p')

        if (bootText !== null) {
          bootText.textContent = '로딩이 길어지고 있습니다. 잠시만 기다려주세요.'
        }
      }, 10000)

      window.addEventListener('error', function () {
        var bootText = document.querySelector('.boot-panel p')

        if (bootText !== null) {
          bootText.textContent = '앱을 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.'
        }
      })

      window.addEventListener('unhandledrejection', function () {
        var bootText = document.querySelector('.boot-panel p')

        if (bootText !== null) {
          bootText.textContent = '앱을 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.'
        }
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Spike: Arcade 경사 램프 + 스쿼시 검증</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1a2e; color: #eee; font-family: monospace; }
  #info { position: fixed; top: 0; left: 0; right: 0; padding: 6px 10px; font-size: 12px; background: rgba(0,0,0,.5); z-index: 10; }
  #game { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="info">
  A/D·←→ 이동 | Space 점프 | S·↓ 공중=내려찍기, 지상=웅크리기(히트박스 0.95타일/시각 1타일) |
  숫자 1/2/3 = 기본 키 1.30 / 1.60 / 1.95타일
</div>
<div id="game"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.85.2/dist/phaser.min.js"></script>
<script>
const TILE = 64;
const W = 1280, H = 704;

const SPEC = {
  runSpeed: 260,
  crouchSpeed: 110,
  jumpVel: -640,
  gravity: 1500,
  poundVel: 1100,
  slideAccel: 3200,        // 한계속도까지 ~0.16초
  slideMax: 520,
  stompDownVel: 300,
  crouchHitboxH: 0.95 * TILE,  // ★ 웅크리기 히트박스 = 0.95타일 (1타일 틈 통과 = 낑김 방지)
  crouchVisualH: 1.00 * TILE,  // ★ 웅크리기 시각 높이 = 1타일
  crouchTopShare: 0.62,        // 웅크린 시각 높이의 상체 비중 (하체를 더 줄임)
  heights: { '1': 1.30 * TILE, '2': 1.60 * TILE, '3': 1.95 * TILE }, // ★ 키 자동보정 1.3~1.95
};

const SLOPES = [
  { x: 8 * TILE,  y: H - 3 * TILE, w: 2 * TILE, h: 2 * TILE, dir: 'up-right' },
  { x: 13 * TILE, y: H - 3 * TILE, w: 4 * TILE, h: 2 * TILE, dir: 'down-right' },
];
const FLATS = [
  { x0: 0,  x1: 7,  yTop: H - TILE },
  { x0: 10, x1: 12, yTop: H - 3 * TILE },
  { x0: 17, x1: 19, yTop: H - TILE },
];

function slopeSurfaceY(s, px) {
  const t = Phaser.Math.Clamp((px - s.x) / s.w, 0, 1);
  return s.dir === 'up-right' ? s.y + s.h - t * s.h : s.y + t * s.h;
}
function slopeGrade(s) { return (s.dir === 'up-right' ? -1 : 1) * (s.h / s.w); }

class Playground extends Phaser.Scene {
  create() {
    let g = this.make.graphics({ add: false });
    g.fillStyle(0xffc857); g.fillRect(8, 0, 48, 64);
    g.fillStyle(0x000000); g.fillRect(20, 20, 8, 8); g.fillRect(38, 20, 8, 8);
    g.generateTexture('avatarTop', 64, 64); g.destroy();
    g = this.make.graphics({ add: false });
    g.fillStyle(0x4ea5d9); g.fillRect(8, 0, 48, 64);
    g.fillStyle(0x2b6f94); g.fillRect(8, 52, 20, 12); g.fillRect(36, 52, 20, 12);
    g.generateTexture('avatarBot', 64, 64); g.destroy();

    const gr = this.add.graphics();
    gr.lineStyle(1, 0xffffff, 0.08);
    for (let gx = 0; gx <= W; gx += TILE) gr.lineBetween(gx, 0, gx, H);
    for (let gy = 0; gy <= H; gy += TILE) gr.lineBetween(0, gy, W, gy);
    gr.fillStyle(0x3d5a3d);
    for (const f of FLATS) gr.fillRect(f.x0 * TILE, f.yTop, (f.x1 - f.x0 + 1) * TILE, H - f.yTop);
    gr.fillStyle(0x6b4d3d);
    for (const s of SLOPES) {
      const pts = s.dir === 'up-right'
        ? [{x:s.x,y:s.y+s.h},{x:s.x+s.w,y:s.y+s.h},{x:s.x+s.w,y:s.y}]
        : [{x:s.x,y:s.y},{x:s.x,y:s.y+s.h},{x:s.x+s.w,y:s.y+s.h}];
      gr.fillPoints(pts, true);
      gr.fillRect(s.x, s.y + s.h, s.w, H - (s.y + s.h));
    }

    // ---- 플레이어 (키 가변) ----
    this.playerH = SPEC.heights['2']; // 기본 키 (서 있을 때)
    this.bodyH = this.playerH;        // 현재 히트박스 높이 (웅크리면 0.95타일)
    this.player = this.physics.add.body(3 * TILE, H - TILE - this.playerH, 64, this.playerH);
    this.player.setCollideWorldBounds(true);
    this.botHalf = this.add.image(0, 0, 'avatarBot').setOrigin(0.5, 0);
    this.topHalf = this.add.image(0, 0, 'avatarTop').setOrigin(0.5, 1);

    this.state = 'normal';
    this.slideSlope = null;
    this.wasGrounded = true;
    this.prevFootY = this.player.y + this.playerH;
    this.pulse = { top: 1, bot: 1 };
    this.crouchT = 0; // 0=서있음, 1=완전 웅크림 (보간)

    this.keys = this.input.keyboard.addKeys('A,D,S,SPACE,LEFT,RIGHT,DOWN,ONE,TWO,THREE');
    this.hud = this.add.text(8, 26, '', { fontSize: 14, color: '#fff' });
    window.__spike = this;
  }

  setHeight(h) { // 기본 키 변경 (발 위치 유지)
    const footY = this.player.y + this.bodyH;
    this.playerH = h;
    this.bodyH = this.state === 'crouch' ? SPEC.crouchHitboxH : h;
    this.player.setSize(64, this.bodyH);
    this.player.y = footY - this.bodyH;
    this.prevFootY = footY;
  }

  setBodyH(h) { // 히트박스 높이 전환 (웅크리기, 발 위치 유지)
    if (h === this.bodyH) return;
    const footY = this.player.y + this.bodyH;
    this.bodyH = h;
    this.player.setSize(64, h);
    this.player.y = footY - h;
    this.prevFootY = footY;
  }

  onGroundY(px) {
    for (const f of FLATS) if (px >= f.x0 * TILE && px < (f.x1 + 1) * TILE) return f.yTop;
    return null;
  }
  currentSlope(px) {
    for (const s of SLOPES) if (px >= s.x && px <= s.x + s.w) return s;
    return null;
  }

  update(_, dtMs) {
    const dt = Math.min(dtMs / 1000, 0.05);
    const b = this.player;
    const k = this.keys;
    const left = k.A.isDown || k.LEFT.isDown;
    const right = k.D.isDown || k.RIGHT.isDown;
    const down = k.S.isDown || k.DOWN.isDown;
    const jumpPressed = Phaser.Input.Keyboard.JustDown(k.SPACE);
    const downPressed = Phaser.Input.Keyboard.JustDown(k.S) || Phaser.Input.Keyboard.JustDown(k.DOWN);

    // 키(신장) 전환 테스트
    if (Phaser.Input.Keyboard.JustDown(k.ONE)) this.setHeight(SPEC.heights['1']);
    if (Phaser.Input.Keyboard.JustDown(k.TWO)) this.setHeight(SPEC.heights['2']);
    if (Phaser.Input.Keyboard.JustDown(k.THREE)) this.setHeight(SPEC.heights['3']);

    const footX = b.x + 32;
    const footY = b.y + this.bodyH;
    const slope = this.currentSlope(footX);
    const flatY = this.onGroundY(footX);

    // ---- 지면 판정: 접지 유지 + 스윕 크로싱 ----
    let grounded = false, surfaceY = null, onSlope = false;
    const tryGround = (sy, isSlope) => {
      if (surfaceY !== null) return;
      if (this.wasGrounded && b.velocity.y >= 0) {
        // 양방향 대칭 여유: 45° 최고속에서 표면이 프레임당 |vx|·dt 만큼 오르내림
        const snapDist = Math.abs(b.velocity.x) * dt * 2 + 12;
        if (Math.abs(footY - sy) <= snapDist) { surfaceY = sy; onSlope = isSlope; }
      } else if (b.velocity.y >= 0 && this.prevFootY <= sy + 4 && footY >= sy - 4) {
        surfaceY = sy; onSlope = isSlope;
      }
    };
    if (slope) tryGround(slopeSurfaceY(slope, footX), true);
    if (flatY !== null) tryGround(flatY, false);
    if (surfaceY !== null) {
      b.y = surfaceY - this.bodyH;
      b.velocity.y = 0;
      grounded = true;
    } else {
      b.velocity.y += SPEC.gravity * dt;
    }
    this.prevFootY = b.y + this.bodyH;

    if (grounded && !this.wasGrounded) this.pulseSquash('top'); // 착지: 상체 아래로 눌림
    this.wasGrounded = grounded;

    // ---- 상태 머신 ----
    if (this.state === 'pound') {
      b.velocity.x = 0;
      if (grounded) {
        if (onSlope) { this.state = 'slide'; this.slideSlope = slope; }
        else this.state = 'normal';
      }
    } else if (this.state === 'slide') {
      const s = this.slideSlope;
      const downhill = slopeGrade(s) < 0 ? -1 : 1;
      b.velocity.x = Phaser.Math.Clamp(b.velocity.x + downhill * SPEC.slideAccel * dt, -SPEC.slideMax, SPEC.slideMax);
      if (jumpPressed) {
        this.state = 'normal';
        b.velocity.y = SPEC.jumpVel;
        this.pulseSquash('bot');
      } else if (grounded && !onSlope) {
        this.state = 'normal';
      }
    } else {
      this.state = grounded && down ? 'crouch' : 'normal';
      const speed = this.state === 'crouch' ? SPEC.crouchSpeed : SPEC.runSpeed;
      b.velocity.x = left ? -speed : right ? speed : 0;

      if (jumpPressed && grounded) {
        b.velocity.y = SPEC.jumpVel;
        this.pulseSquash('bot'); // 점프: 하체 위로 눌림
      }
      if (downPressed && !grounded) {
        this.state = 'pound';
        b.velocity.x = 0;
        b.velocity.y = SPEC.poundVel;
      }
    }

    // ---- 웅크리기 히트박스 전환 (발 위치 유지) ----
    this.setBodyH(this.state === 'crouch' ? SPEC.crouchHitboxH : this.playerH);

    // ---- 스쿼시/웅크리기 렌더 ----
    // 기본: 상/하체 = playerH의 절반씩
    // 웅크리기(시각): 총 1타일, 상체 62% / 하체 38% (하체가 더 줄어듦)
    // ★ 허리 y는 하체 펄스와 무관하게 고정 — 하체 펄스는 발이 위로 들리는 방향
    const targetCrouch = this.state === 'crouch' ? 1 : 0;
    this.crouchT += (targetCrouch - this.crouchT) * Math.min(1, dt * 14);
    this.pulse.top += (1 - this.pulse.top) * Math.min(1, dt * 8);
    this.pulse.bot += (1 - this.pulse.bot) * Math.min(1, dt * 8);

    const halfH = this.playerH / 2;
    const cTopH = SPEC.crouchVisualH * SPEC.crouchTopShare;
    const cBotH = SPEC.crouchVisualH * (1 - SPEC.crouchTopShare);
    const topBaseH = Phaser.Math.Linear(halfH, cTopH, this.crouchT);
    const botBaseH = Phaser.Math.Linear(halfH, cBotH, this.crouchT);
    const topH = topBaseH * this.pulse.top;   // 착지: 상체가 허리 쪽(아래)으로 눌림
    const botH = botBaseH * this.pulse.bot;   // 점프: 하체가 줄며 발이 위로 들림

    const px = b.x + 32;
    const physFootY = b.y + this.bodyH;
    const waistY = physFootY - botBaseH;      // ★ 펄스 미적용 기준값 → 허리·상체 고정
    this.botHalf.setPosition(px, waistY).setScale(1, botH / 64);
    this.topHalf.setPosition(px, waistY).setScale(1, topH / 64);

    this.hud.setText(
      `state=${this.state} 키=${(this.playerH / TILE).toFixed(2)}타일 히트박스=${(this.bodyH / TILE).toFixed(2)}타일 ` +
      `vx=${b.velocity.x | 0} vy=${b.velocity.y | 0} grounded=${grounded} onSlope=${onSlope} ` +
      `표시키=${((topH + botH) / TILE).toFixed(2)}타일`
    );
  }

  pulseSquash(part) { this.pulse[part] = 0.55; }

  applyStomp() {
    const b = this.player;
    if (b.velocity.y < 0) b.velocity.y = SPEC.stompDownVel;
    else b.velocity.y += SPEC.stompDownVel;
    this.pulseSquash('top');
  }
}

new Phaser.Game({
  type: Phaser.AUTO, width: W, height: H, pixelArt: true, parent: 'game',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
  scene: Playground, backgroundColor: '#16213e',
});
</script>
</body>
</html>
